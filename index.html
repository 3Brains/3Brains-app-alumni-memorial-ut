const extractYear = (dateStr) => {
  if (!dateStr) return null;
  const m = String(dateStr).match(/\b(19|20)\d{2}\b/);
  return m ? m[0] : null;
};

const toTitleCase = (str) => {
  if (!str) return str;
  return str
    .replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase())
    .replace(/'\w/g, (txt) => txt.toUpperCase());
};

const smartTitleCase = (str) => {
  if (!str) return str;
  return str.trim().replace(/\s+/g, ' ').split(' ').map(function(w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
};

const normalizeForWiki = (name) => {
  if (!name) return name;
  name = name.trim();
  if (name.indexOf(',') > -1) {
    const parts = name.split(',');
    name = parts[1].trim() + ' ' + parts[0].trim();
  }
  const words = name.split(/\s+/).filter(w => {
    const stripped = w.replace(/\./g, '');
    return stripped.length > 1;
  });
  if (words.length >= 3) return toTitleCase(words[0] + ' ' + words[words.length - 1]);
  return toTitleCase(words.join(' '));
};

const addInitialPeriods = (name) => {
  if (!name) return name;
  return name.trim().split(/\s+/).map((word, i, arr) => {
    if (word.length === 1 && /[A-Za-z]/.test(word) && i > 0 && i < arr.length - 1) return word + '.';
    return word;
  }).join(' ');
};

const fuzzyMatch = (a, b) => {
  if (!a || !b) return false;
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  if (a === b) return true;
  if (a.startsWith(b) || b.startsWith(a)) return true;
  const longer = a.length >= b.length ? a : b;
  const shorter = a.length < b.length ? a : b;
  if (longer.length === 0) return true;
  let matches = 0;
  for (let i = 0; i < shorter.length; i++) { if (longer.indexOf(shorter[i]) !== -1) matches++; }
  return (matches / longer.length) >= 0.8;
};

const parseBirthYear = (birth_date) => {
  if (!birth_date) return 9999;
  var yr = parseInt(extractYear(birth_date) || '0');
  return yr > 0 ? yr : 9999;
};

const scoreResult = (result, searchFirst, searchMiddle, searchLast, searchBirthYear, searchSuffix) => {
  let score = 0;
  const rFirst = (result.first_name || '').toUpperCase();
  const rMiddle = (result.middle_name || '').toUpperCase();
  const rLast = (result.last_name || '').toUpperCase();
  const rSuffix = (result.suffix || '').toUpperCase();
  const rDob = (result.birth_date || '');
  const sFirst = (searchFirst || '').toUpperCase();
  const sMiddle = (searchMiddle || '').toUpperCase().replace('.','');
  const sLast = (searchLast || '').toUpperCase();
  const sSuffix = (searchSuffix || '').toUpperCase();
  const lastNameOnly = !sFirst;
  score += lastNameOnly ? 50 : 30;
  if (sFirst) {
    if (rFirst === sFirst) score += 30;
    else if (rFirst.startsWith(sFirst) && rFirst.length <= sFirst.length + 1) score += 15;
  }
  if (sMiddle && rMiddle) {
    if (rMiddle === sMiddle || rMiddle.startsWith(sMiddle) || sMiddle.startsWith(rMiddle)) score += 30;
  }
  if (searchBirthYear && rDob) { if (rDob.includes(searchBirthYear)) score += 15; }
  if (sSuffix && rSuffix && rSuffix === sSuffix) score += 5;
  return score;
};

const confidenceLabel = (score) => {
  if (score >= 90) return COPY.confidenceProbable;
  if (score >= 60) return COPY.confidencePotential;
  return COPY.confidencePartial;
};

function isDeceasedCheck(extract, description, deathDate, type) {
  if (type === 'disambiguation') return false;
  if (deathDate) return true;
  const firstSentence = extract ? extract.split('.')[0] : '';
  const hasDeathInBrackets = /\(\d{4}\s*[-\u2013\u2014]+\s*\d{4}\)/.test(firstSentence);
  const hasBornOnly = /\([^)]*born\s+\w+\s+\d+,\s+\d{4}\)/.test(firstSentence) || /\([^)]*born\s+\d{4}\)/.test(firstSentence);
  if (hasBornOnly) return false;
  const isPastTense = /^[^.]*\bwas (an?|the)\b[^.]*\./.test(extract) && !/\([^)]*born/.test(firstSentence) && !/born\s+\d{4}/.test(description) && !/\b(serves|serving|since|has served|has been|retired)\b/i.test(extract);
  const diedInFirstSentence = /\b(died|passed away|deceased)\b/i.test(firstSentence);
  const diedInDescription = /\b(died|passed away|deceased)\b/i.test(description);
  return hasDeathInBrackets || isPastTense || diedInFirstSentence || diedInDescription;
}

const Wiki = {
  fetchAction: async function(name) {
    try {
      const params = new URLSearchParams({
        action: 'query', titles: name, prop: 'extracts|pageprops|categories|info',
        exintro: 'true', explaintext: 'true', redirects: '1', cllimit: '50', format: 'json', origin: '*'
      });
      const data = await (await fetch('https://en.wikipedia.org/w/api.php?' + params)).json();
      const pages = data.query && data.query.pages ? data.query.pages : {};
      var page = Object.values(pages)[0];
      if (!page || page.missing !== undefined) {
        try {
          const searchParams = new URLSearchParams({
            action: 'query', list: 'search', srsearch: name, srlimit: '1', format: 'json', origin: '*'
          });
          const searchData = await (await fetch('https://en.wikipedia.org/w/api.php?' + searchParams)).json();
          const searchResults = searchData.query && searchData.query.search;
          if (searchResults && searchResults.length > 0) {
            const foundTitle = searchResults[0].title;
            const params2 = new URLSearchParams({
              action: 'query', titles: foundTitle, prop: 'extracts|pageprops|categories|info',
              exintro: 'true', explaintext: 'true', redirects: '1', cllimit: '50', format: 'json', origin: '*'
            });
            const data2 = await (await fetch('https://en.wikipedia.org/w/api.php?' + params2)).json();
            const pages2 = data2.query && data2.query.pages ? data2.query.pages : {};
            page = Object.values(pages2)[0];
            if (!page || page.missing !== undefined) return null;
          } else { return null; }
        } catch(e) { return null; }
      }
      const title = page.title || name;
      const extract = page.extract || '';
      const categories = (page.categories || []).map(cat => cat.title || '');
      const deathFromCategory = categories.some(cat => /deaths|murdered|executed/i.test(cat));
      const isDisambig = !!(page.pageprops && page.pageprops.disambiguation !== undefined) || title.toLowerCase().includes('(disambiguation)');
      if (isDisambig) return { type: 'disambiguation', isDisambiguation: true, title: title.replace(/ \(disambiguation\)/i, ''), extract, matches: [] };
      let thumbnail = null, birthDate = null, deathDate = null, description = '';
      try {
        const sum = await (await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))).json();
        thumbnail = sum.thumbnail ? sum.thumbnail.source : null;
        birthDate = sum.birth_date || null;
        deathDate = sum.death_date || null;
        description = sum.description || '';
        const isNotPerson = /\b(film|movie|album|song|television|TV series|video game|book|novel)\b/i.test(description) && !birthDate;
        if (isNotPerson) return null;
      } catch(e) {}
      if (!deathDate || deathDate.length <= 4) {
        const months = 'January|February|March|April|May|June|July|August|September|October|November|December';
        const dateMatches = extract.match(new RegExp('(?:' + months + ') [0-9]{1,2}, [0-9]{4}', 'g'));
        if (dateMatches && dateMatches.length >= 2) deathDate = dateMatches[dateMatches.length - 1];
        else if (dateMatches && dateMatches.length === 1 && /died|passed|\u2013|\u2014/.test(extract.split('.')[0])) deathDate = dateMatches[0];
      }
      if (deathDate && !deathFromCategory) {
        const yr = parseInt(extractYear(deathDate) || '0');
        if (!yr || yr < 1900 || yr > 2030) deathDate = null;
      }
      // CRITICAL ORDERING — do not reorder these next 4 lines. See DECISION-2026-03-XX-MW-ARCH-001.
      const isLikelyAlive = /\b(serving|serves|since|current|retired)\b/i.test(description) || /\bretired\b/i.test(extract) || /chief justice|associate justice/i.test(description) || (/\bborn\b/i.test(extract.split('.')[0]) && !/\(\d{4}[-\u2013\u2014]+\d{4}\)/.test(description));
      if (isLikelyAlive) deathDate = null;
      const deceased = (deathFromCategory && !isLikelyAlive) || (!!deathDate && !isLikelyAlive) || (!isLikelyAlive && isDeceasedCheck(extract, description, deathDate, 'standard'));
      return { title, extract, thumbnail, birthDate, deathDate: deceased ? (deathDate || 'deceased') : null, description, isDisambiguation: false, deathFromCategory };
    } catch(e) { return null; }
  },

  fetchDisambigMatches: async function(title) {
    try {
      const url = 'https://en.wikipedia.org/w/api.php?action=parse&page=' + encodeURIComponent(title) + '&prop=links&format=json&origin=*';
      const data = await (await fetch(url)).json();
      const links = (data.parse && data.parse.links) ? data.parse.links : [];
      const personLinks = links.filter(l => l.ns === 0 && l['*'] && l['*'].length > 2).map(l => l['*']).slice(0, 20);
      const results = [];
      const titleParts = title.trim().split(/\s+/);
      const searchLastName = titleParts[titleParts.length - 1].toUpperCase();
      for (const link of personLinks) {
        const profile = await Wiki.fetchAction(link);
        if (!profile || profile.isDisambiguation || !profile.extract) continue;
        const linkLastName = profile.title ? profile.title.trim().split(/\s+/).pop().toUpperCase() : '';
        if (searchLastName.length > 2 && linkLastName !== searchLastName) continue;
        const desc = (profile.description || '').toLowerCase();
        const extract = (profile.extract || '').toLowerCase();
        const looksLikePerson = profile.birthDate || profile.deathDate ||
          /\b(born|died|american|british|politician|actor|actress|singer|musician|athlete|author|writer|director|businessman|scientist|lawyer|doctor|physician|soldier|general|president|senator|governor|mayor)\b/.test(desc + ' ' + extract);
        if (!looksLikePerson) continue;
        results.push(profile);
        if (results.length >= 6) break;
      }
      return results;
    } catch(e) { return []; }
  },

  fetchProfile: async function(name) {
    try {
      const nameWithPeriods = addInitialPeriods(name.trim());
      let result = null;
      try { result = await Wiki.fetchAction(nameWithPeriods); } catch(e) {}
      if (!result) {
        try { result = await Wiki.fetchAction(name.trim().toLowerCase()); } catch(e) {}
      }
      if (!result) return { isDisambiguation: false, notFound: true };
      if (result.type === 'disambiguation') {
        let matches = [];
        try { matches = await Wiki.fetchDisambigMatches(result.title); } catch(e) {}
        return { isDisambiguation: true, title: result.title || name, matches: matches || [] };
      }
      const searchWords = name.trim().toLowerCase().split(/\s+/);
      const titleWords = (result.title || '').toLowerCase().replace(/\(.*\)/g, '').trim().split(/\s+/);
      const searchLast = searchWords[searchWords.length - 1];
      const titleLast = titleWords[titleWords.length - 1];
      if (!fuzzyMatch(searchLast, titleLast)) return { isDisambiguation: false, notFound: true };
      return result;
    } catch(e) { return { isDisambiguation: false, notFound: true }; }
  }
};
/* === MODULE: WIKIPEDIA END === */

const Ssdi = {
  getCache: function() {
    try { return JSON.parse(localStorage.getItem(APP_META.ssdiCacheKey) || '{}'); } catch(e) { return {}; }
  },

  cacheRecord: function(name, record) {
    if (!name || !record) return;
    try {
      const cache = Ssdi.getCache();
      cache[name.trim().toLowerCase()] = {
        name: record.name,
        first_name: record.first_name,
        last_name: record.last_name,
        middle_name: record.middle_name,
        suffix: record.suffix,
        birth_date: record.birth_date,
        death_date: record.death_date,
        state: record.state
      };
      localStorage.setItem(APP_META.ssdiCacheKey, JSON.stringify(cache));
    } catch(e) {}
  },

  getCached: function(name) {
    if (!name) return null;
    try {
      const cache = Ssdi.getCache();
      return cache[name.trim().toLowerCase()] || null;
    } catch(e) { return null; }
  },

  getCachedFlexible: function(name) {
    if (!name) return null;
    var hit = Ssdi.getCached(name);
    if (hit) return hit;
    var normalized = normalizeForWiki(name);
    if (normalized && normalized.toLowerCase() !== name.trim().toLowerCase()) {
      hit = Ssdi.getCached(normalized);
      if (hit) return hit;
    }
    try {
      var cache = Ssdi.getCache();
      var parts = name.trim().toLowerCase().split(/\s+/);
      var nameFirst = parts[0] || '';
      var nameLast = parts[parts.length - 1] || '';
      var keys = Object.keys(cache);
      for (var i = 0; i < keys.length; i++) {
        var kparts = keys[i].split(/\s+/);
        var kFirst = kparts[0] || '';
        var kLast = kparts[kparts.length - 1] || '';
        if (fuzzyMatch(nameFirst, kFirst) && fuzzyMatch(nameLast, kLast)) return cache[keys[i]];
      }
    } catch(e) {}
    return null;
  },

  search: async function(params) {
    const token = localStorage.getItem(APP_META.storageKeys.token);
    const qs = new URLSearchParams(params);
    try {
      const r = await fetch(API_BASE + '/ssdi/search?' + qs.toString(), { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) return { results: [], has_more: false };
      return await r.json();
    } catch(e) { return { results: [], has_more: false }; }
  }
};

  useEffect(() => {
    fetch(API_BASE + '/health').then(r => r.json()).then(d => setApiVersion(d.version || '?')).catch(() => setApiVersion('?'));
    const t = localStorage.getItem(APP_META.storageKeys.token);

        setTimeout(() => { document.querySelectorAll('input').forEach(i => i.blur()); }, 100);
      }

    document.addEventListener('visibilitychange', handleVisibilityChange);

  const loadWatchlist = async () => {
    if (!APP_META.modules.watchlist && !APP_META.modules.memories) return;
    try {
      const token = localStorage.getItem(APP_META.storageKeys.token);
      const r = await fetch(API_BASE + '/watchlist', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Failed');
      setWatchlist(await r.json());
    } catch (e) { console.error(e); }
  };

  const loadNotifications = async () => {
    if (!APP_META.modules.alerts) return;
    try {
      const token = localStorage.getItem(APP_META.storageKeys.token);
      const r = await fetch(API_BASE + '/notifications', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Failed');
      setNotifications(await r.json());
    } catch (e) { console.error(e); }
  };

  /* ─── Alerts helpers (preserved verbatim from MW v1.0.180) ─── */
  const dismissAlert = async (notifId, watchlistId) => {
    const token = localStorage.getItem(APP_META.storageKeys.token);
    setNotifications(prev => prev.filter(n => n.id !== notifId));
    try { await fetch(API_BASE + '/notifications/' + notifId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {}
    if (watchlistId) {
      try { await fetch(API_BASE + '/watchlist/' + watchlistId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); await loadWatchlist(); } catch(e) {}
    }
  };

  const keepAlert = async (notifId, watchlistId, notifName) => {
    const token = localStorage.getItem(APP_META.storageKeys.token);
    setNotifications(prev => prev.filter(n => n.id !== notifId));
    var isTest = String(notifId).indexOf('test-') === 0;
    if (!isTest) {
      try { await fetch(API_BASE + '/notifications/' + notifId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {}
    }
    if (watchlistId) {
      try {
        const wItem = watchlist.find(w => w.id === watchlistId);
        const itemName = (wItem && wItem.name) || notifName || '';
        if (!isTest) {
          await fetch(API_BASE + '/watchlist/' + watchlistId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
        }
        if (itemName) {
          const alreadyIn = isOnWatchlist(itemName);
          if (alreadyIn !== 'memories') {
            await fetch(API_BASE + '/watchlist', {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ name: itemName, location: (wItem && wItem.location) || '', dob: (wItem && wItem.dob) || '', is_deceased: true, death_year: (wItem && wItem.death_year) || null })
            });
          }
        }
        await loadWatchlist();
        setPage('memories');
      } catch(e) { console.log('keepAlert error:', e); }
    }
  };

  const dismissAlert2 = async (notifId, watchlistId) => {
    var isTest = String(notifId).indexOf('test-') === 0;
    const token = localStorage.getItem(APP_META.storageKeys.token);
    setNotifications(prev => prev.filter(n => n.id !== notifId));
    if (!isTest) {
      try { await fetch(API_BASE + '/notifications/' + notifId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {}
      if (watchlistId) {
        try { await fetch(API_BASE + '/watchlist/' + watchlistId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); await loadWatchlist(); } catch(e) {}

    if (wItem) { openWatchlistDrawer(wItem); }

  const injectTestAlert = () => {
    const target = watchlist.find(w => !(w.is_deceased === true || w.is_deceased === 1));
    if (!target) { alert(COPY.alertsNeedWatchlist); return; }
    const fakeNotif = {

      watchlist_id: target.id,
      message: COPY.alertsTestInjectMsg,
      created_at: new Date().toISOString()
    };
    setNotifications(prev => [fakeNotif].concat(prev));

  };

  /* ─── Auth ─── */
  const doAuth = async (authMode) => {
    if (!email || !password) return;

  const isOnWatchlist = (name) => {
    if (!name) return false;
    try {
      const nameLower = name.trim().toLowerCase();
      const exactMatch = watchlist.find(w => w && w.name && w.name.trim().toLowerCase() === nameLower);
      if (exactMatch) return (exactMatch.is_deceased === true || exactMatch.is_deceased === 1) ? 'memories' : 'watchlist';
      const nameParts = nameLower.split(/\s+/);
      const hasMiddle = nameParts.length > 2;
      if (hasMiddle) return false;
      const normalized = normalizeForWiki(name).toLowerCase();
      const found = watchlist.find(w => {
        if (!w || !w.name) return false;
        const storedParts = w.name.trim().toLowerCase().split(/\s+/);
        if (storedParts.length > 2) return false;
        const stored = normalizeForWiki(w.name).toLowerCase();
        return stored === normalized;
      });
      if (!found) return false;
      return (found.is_deceased === true || found.is_deceased === 1) ? 'memories' : 'watchlist';

  const SSIDResultsBlock = ({ ssdiResults, searchFirst, searchMiddle, searchLast, searchBirthYear, searchSuffix, apiHasMore, onLoadMore, birthYearFallback }) => {

  const WatchlistCheckCard = () => {

      deathDate: rawProfile.deathDate || null,

    const wikiMatchConfident = (() => {
      if (!profile || profile.notFound || profile.isDisambiguation || !profile.title) return false;

      const titleWords = profile.title.toLowerCase().split(/\s+/);
      const titleFirst = titleWords[0] || '';
      const titleLast = titleWords[titleWords.length - 1] || '';
      const firstMatch = searchFirst.toLowerCase() === titleFirst.toLowerCase() || (searchFirst.length >= 5 && titleFirst.toLowerCase().startsWith(searchFirst.toLowerCase()));
      if (!firstMatch) return false;
      if (!fuzzyMatch(searchLast, titleLast)) return false;
      if (nw.middle) {
        const mid = nw.middle.trim().toLowerCase().replace(/\./g, '');

        if (mid.length > 0 && !titleLower.includes(' ' + mid.charAt(0)) && !titleLower.includes(mid)) return false;

      if (nw.birthYear && profile.birthDate && !profile.birthDate.includes(nw.birthYear)) return false;

              <button onClick={clearWatchlistCheck} className="w-full py-3 bg-white/10 border border-white/20 text-white/80 rounded-xl text-xl text-center">{COPY.actionSearchAnother}</button>

    return (
      <div className="rounded-2xl overflow-hidden border border-orange-800 shadow-lg">

        <div className="bg-gray-900/70 p-4">

          {!notFound && !wikiMatchConfident && !isWikiDeceased && (nw.middle || nw.birthYear) && !hasSSdi && <div className="mb-3 p-3 bg-yellow-900/20 border border-yellow-700/30 rounded-lg"><p className="text-yellow-300 text-sm font-bold">No exact SSDI matches for those details.</p><p className="text-yellow-200 text-xs mt-1">They may have passed after 2014, or try different details.</p></div>}
          {(!wikiMatchConfident || isWikiDeceased) && <SSIDResultsBlock ssdiResults={ssdiResults} searchFirst={searchFirst} searchMiddle={nw.middle} searchLast={searchLast} searchBirthYear={nw.birthYear} searchSuffix={nw.suffix} apiHasMore={watchlistCheck && watchlistCheck.ssdiHasMore} onLoadMore={loadMoreSsdiSearch} birthYearFallback={watchlistCheck && watchlistCheck.birthYearFallback} />}
          {ssdiDeceased && !isWikiDeceased && !wikiMatchConfident && APP_META.modules.memories && (
            <div className="space-y-2 mt-2 border-t border-white/10 pt-2">
              {fullNameStatus
                ? <p className="w-full py-3 text-center text-green-400 text-2xl font-bold">{COPY.format(COPY.alreadyInListGeneric, { list: fullNameStatus })}</p>
                : <button onClick={saveSearchedNameToMemories} disabled={loadingMem} className="w-full py-4 bg-gray-700 hover:bg-gray-600 border border-gray-500 text-white rounded-xl font-bold text-2xl flex items-center justify-center gap-2 disabled:opacity-50">
                    <PlusIcon /> {loadingMem ? COPY.actionSavingMemories : COPY.format(COPY.actionSaveMemoryTempl, { name: buildFullName() })}
                  </button>
              }
              <button onClick={() => { setWatchlistChecked(false); setWatchlistCheck(null); setSelectedDisambig(null); setSsdiPage(1); window.scrollTo(0,0); }} className="w-full py-3 bg-white/10 border border-white/20 text-white/80 rounded-xl text-xl text-center flex items-center justify-center gap-2">
                <EditIcon /> {COPY.actionEditName}
              </button>
              <button onClick={clearWatchlistCheck} className="w-full py-2 text-white/40 text-xl text-center">{COPY.actionSearchAnother}</button>

          {isWikiDeceased && (

              <div className="p-2 bg-gray-700/50 border border-gray-600/30 rounded-xl mb-3">
                {!wikiMatchConfident && <SSIDResultsBlock ssdiResults={ssdiResults} searchFirst={searchFirst} searchMiddle={nw.middle} searchLast={searchLast} searchBirthYear={nw.birthYear} searchSuffix={nw.suffix} apiHasMore={watchlistCheck && watchlistCheck.ssdiHasMore} onLoadMore={loadMoreSsdiSearch} birthYearFallback={watchlistCheck && watchlistCheck.birthYearFallback} />}
                <p className="text-gray-200 text-xl text-center">This person has passed away.{profile.deathDate && profile.deathDate !== 'deceased' ? ' ' + COPY.labelDod + ': ' + profile.deathDate : ''}</p>
              </div>
              <div className="space-y-2 mt-2">
                {profile && profile.title && APP_META.modules.memories && (() => {

                  return (
                    <button onClick={async () => {
                      setLoadingMem(true);
                      try {
                        const token = localStorage.getItem(APP_META.storageKeys.token);
                        const r = await fetch(API_BASE + '/watchlist', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ name: profile.title, location: '', dob: '', is_deceased: true, death_year: extractYear(profile.deathDate) }) });
                        if (!r.ok) throw new Error('Failed');
                        await loadWatchlist(); clearWatchlistCheck(); setPage('memories');
                      } catch(e) { alert(COPY.format(COPY.errorGeneric, { msg: e.message })); }
                      finally { setLoadingMem(false); }

                      <PlusIcon /> {loadingMem ? COPY.actionSavingMemories : COPY.format(COPY.actionSaveMemoryTempl, { name: profile.title })}

                  <EditIcon /> {COPY.actionEditName}

                <button onClick={clearWatchlistCheck} className="w-full py-3 bg-white/10 border border-white/20 text-white/80 rounded-xl text-xl text-center">{COPY.actionSearchAnother}</button>

        )}

        {page === 'notifications' && APP_META.modules.alerts && (
          <div className="space-y-3" style={{ paddingTop: "1rem" }}>
            <div className={cardClass}>
              <CardPageHeader title={COPY.alertsHeader} subtitle={COPY.alertsSubheader} />
              {notifications.length === 0 ? (
                <div className="text-center py-4">
                  <p className="text-white font-bold text-2xl">{COPY.alertsEmpty}</p>
                  <p className="text-gray-200 text-xl mt-1">{COPY.alertsEmptyHint}</p>
                </div>
              ) : (
                <div className="space-y-3">
                  {notifications.map(n => (
                    <div key={n.id} className="p-3 bg-orange-950/50 border border-orange-800 rounded-xl">
                      <h3 className="font-bold text-white text-xl mb-1">{n.name}</h3>
                      <p className="text-gray-300 text-xl">{n.message}</p>
                      <p className="text-gray-500 text-xl mt-1 mb-2">{new Date(n.created_at).toLocaleDateString()}</p>
                      <div className="flex gap-2">
                        <button onClick={() => viewAlert(n)} className="flex-1 py-2 bg-orange-700/50 border border-orange-600/50 text-white rounded-lg text-xl font-bold">{COPY.actionView}</button>
                        <button onClick={() => keepAlert(n.id, n.watchlist_id, n.name)} className="flex-1 py-2 bg-gray-700/50 border border-gray-600/50 text-gray-200 rounded-lg text-base font-bold">
                          {COPY.actionKeep}<span className="block text-gray-400 text-xs font-normal leading-tight">{COPY.actionKeepSub}</span>
                        </button>
                        <button onClick={() => dismissAlert2(n.id, n.watchlist_id)} className="flex-1 py-2 bg-transparent border border-orange-900/50 text-orange-400 rounded-lg text-base">
                          {COPY.actionDismiss}<span className="block text-orange-600 text-xs leading-tight">{COPY.actionDismissSub}</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {page === 'about' && (
          <div className="space-y-4 pb-8" style={{ paddingTop: '1rem' }}>
            <div className={cardClass}>
              <div className="mb-3 pb-2 border-b border-orange-900/30 text-center">
                <h2 className="text-4xl font-black text-white tracking-wide">{COPY.aboutHeader}</h2>
                <h2 className="text-4xl font-black text-white tracking-wide">{COPY.appName}</h2>
              </div>
              <p className="text-orange-300 italic text-xl text-center mb-3">v{APP_META.version}</p>
              <div className="flex items-center gap-4 mb-4">
                <img src={SKIN.assets.founderPhoto} alt={COPY.founderName} className="w-14 h-14 rounded-full object-cover border-2 border-orange-600 shadow-lg shrink-0" />
                <div>
                  <p className="font-bold text-white text-xl">{COPY.founderName}</p>
                  <p className="text-orange-400 italic text-xl">{COPY.founderTitle}</p>
                  <a href={'mailto:' + COPY.founderEmail} className="text-orange-400 text-xl mt-1 block">{COPY.founderEmail}</a>
                </div>
              </div>
              <p className="text-purple-200 text-2xl font-bold italic mb-3">{COPY.tagline}</p>
              <div className="space-y-3 text-gray-200 text-xl leading-relaxed">
                <p>{COPY.aboutStoryP1}</p>
                <p>{COPY.aboutStoryP2}</p>
                <p>{COPY.aboutStoryP3}</p>
                <p>{COPY.aboutStoryP4}</p>
              </div>
            </div>
            <div className={cardClass}>
              <h3 className="text-white text-2xl font-bold mb-4 text-center">{COPY.aboutHowItWorksHeader}</h3>
              <div className="space-y-4">
                <div className="flex gap-3 items-start"><span className="text-orange-400 text-2xl font-black w-7 shrink-0">1.</span><p className="text-gray-300 text-xl">{COPY.aboutHowItWorks1}</p></div>
                <div className="flex gap-3 items-start"><span className="text-orange-400 text-2xl font-black w-7 shrink-0">2.</span><p className="text-gray-300 text-xl">{COPY.aboutHowItWorks2}</p></div>
                <div className="flex gap-3 items-start"><span className="text-orange-400 text-2xl font-black w-7 shrink-0">3.</span><p className="text-gray-300 text-xl">{COPY.aboutHowItWorks3}</p></div>
                <div className="flex gap-3 items-start"><span className="text-orange-400 text-2xl font-black w-7 shrink-0">4.</span><p className="text-gray-300 text-xl">{COPY.aboutHowItWorks4}</p></div>
              </div>
            </div>
            {APP_META.modules.alerts && <div className={cardClass}>
              <h3 className="text-white text-2xl font-bold mb-3">{COPY.aboutAlertsHeader}</h3>
              <div className="space-y-2 text-gray-200 text-xl leading-relaxed">
                <p>{COPY.aboutAlertsBody}</p>
                <p><strong className="text-white">{COPY.aboutAlertView}</strong></p>
                <p><strong className="text-white">{COPY.aboutAlertKeep}</strong></p>
                <p><strong className="text-white">{COPY.aboutAlertDismiss}</strong></p>
              </div>
            </div>}
            <div className={cardClass}>
              <h3 className="font-bold text-white mb-1 text-2xl">{COPY.privacyTitle}</h3>
              <p className="text-gray-400 text-xl mb-3">{COPY.privacyLastUpdated}</p>
              <div className="space-y-3 text-gray-200 text-xl leading-relaxed">
                <p>{COPY.privacyCollect}</p>
                <p>{COPY.privacyUse}</p>
                <p>{COPY.privacySources}</p>
                <p>{COPY.privacyRights}</p>
                <p>{COPY.privacyMinor}</p>
                <p>{COPY.privacyDisclaimer}</p>
                <a href={'mailto:' + COPY.founderEmail} className="text-orange-400 text-xl">{COPY.founderEmail}</a>
              </div>
            </div>
            <div className="px-1 space-y-3 pb-2">
              <div className="p-3 bg-black/30 rounded-xl"><p className="font-medium text-gray-200 text-xl text-center">{user && user.email}</p></div>
              <button onClick={doLogout} className="w-full py-4 bg-orange-700 hover:bg-orange-800 text-white rounded-xl text-2xl font-bold">{COPY.signOut}</button>
              <button onClick={() => setShowDangerZone(!showDangerZone)} className="w-full py-3 text-gray-500 text-xl text-center">{showDangerZone ? COPY.accountRemovalHide : COPY.accountRemoval}</button>
              {showDangerZone && (
                <div className="space-y-3">
                  {!showDeleteConfirm
                    ? <button onClick={() => setShowDeleteConfirm(true)} className="w-full py-4 bg-gray-900/70 border border-orange-800 text-orange-400 rounded-xl text-xl">{COPY.deleteAccount}</button>
                    : <div className="bg-orange-950/90 border border-orange-800 rounded-2xl p-5 space-y-3">
                        <h3 className="font-bold text-orange-400 text-xl">{COPY.deleteConfirmHeader}</h3>
                        <p className="text-orange-300 text-xl">{COPY.deleteConfirmBody}</p>
                        <button onClick={doDeleteAccount} className="w-full py-4 bg-orange-700 text-white rounded-xl font-bold text-xl">{COPY.deleteConfirmBtn}</button>
                        <button onClick={() => { setShowDeleteConfirm(false); setShowDangerZone(false); }} className="w-full py-4 bg-gray-800 border border-gray-600 text-gray-300 rounded-xl font-medium text-xl">{COPY.deleteConfirmCancel}</button>
                      </div>
                  }
                </div>
              )}
            </div>
            <p className="text-white/30 text-center text-sm pb-4">v{APP_META.version}</p>
          </div>
        )}

      </div>

      {APP_META.modules.navigation && <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: 'rgba(5,0,15,0.95)', backdropFilter: 'blur(8px)', borderTop: '1px solid ' + SKIN.colors.primaryDeep, padding: '0.5rem 1rem', paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}>
        <div className="flex justify-around max-w-sm mx-auto">
          <button onClick={() => { clearWatchlistCheck(); setPage('search'); }} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'search' ? 'text-orange-400' : 'text-gray-400')}>
            <SearchIcon /><span className="text-xl font-medium">{COPY.navSearch}</span>
          </button>
          {APP_META.modules.watchlist && <button onClick={() => setPage('watchlist')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'watchlist' ? 'text-orange-400' : 'text-gray-400')}>
            <HeartIcon /><span className="text-xl font-medium">{COPY.navWatchlist}</span>
          </button>}
          {APP_META.modules.memories && <button onClick={() => setPage('memories')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'memories' ? 'text-orange-400' : 'text-gray-400')}>
            <MemoriesIcon />
            <span className="text-xl font-medium">{COPY.navMemories}</span>
          </button>}
          <button onClick={() => setPage('about')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'about' ? 'text-orange-400' : 'text-gray-400')}>
            <InfoIcon /><span className="text-xl font-medium">{COPY.navInfo}</span>
          </button>
          {APP_META.modules.alerts && <button onClick={() => setPage('notifications')} className={'flex flex-col items-center gap-0.5 px-1 py-1 relative ' + (page === 'notifications' ? 'text-orange-400' : 'text-gray-400')}>
            <BellIcon red={unreadCount > 0} />
            {unreadCount > 0 && <span className="absolute top-0 right-1 bg-orange-600 text-white text-xl font-bold rounded-full w-4 h-4 flex items-center justify-center">{unreadCount > 9 ? '9+' : unreadCount}</span>}
            <span className="text-xl font-medium" style={unreadCount > 0 ? {color: SKIN.colors.primary} : {}}>{COPY.navAlerts}</span>
          </button>}
        </div>
        <p className="text-center text-gray-600 text-xs mt-1" style={{display: page === 'search' ? 'none' : 'block'}}>app v{APP_META.version} | api v{apiVersion}</p>
      </div>}
    </PageWrapper>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
